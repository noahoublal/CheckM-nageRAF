<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#c8102e"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAF Ménage">
<title>RAF · Check ménage Paul-Lignon</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#1b1b1b;--mu:#6b6b6b;--ln:#e6dfd0;--ok:#1f8a4c;--rd:#c8102e;--go:#ffc72c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141214;--card:#211d20;--tx:#f3efe8;--mu:#a8a1a5;--ln:#383236;--ok:#3ccf7a}}
:root[data-theme="dark"]{--bg:#141214;--card:#211d20;--tx:#f3efe8;--mu:#a8a1a5;--ln:#383236;--ok:#3ccf7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--rd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--rd);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--go)}
.logo{height:46px;width:auto;flex:none}.shield{width:38px;height:38px;border-radius:50%;background:var(--go);color:var(--rd);font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid #fff;flex:none}
header h1{font-size:17px;margin:0;line-height:1.15}header small{opacity:.85;font-size:12px}
#back{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:20px;border-radius:10px;width:38px;height:38px;display:none}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.mc{cursor:pointer}.mc.next{border:2px solid var(--rd);box-shadow:0 0 0 3px var(--go)}.mc.past{opacity:.6}
.j{background:var(--rd);color:#fff;border-radius:10px;min-width:44px;padding:6px 0;text-align:center;font-weight:800;font-size:13px}
.mc b{display:block}.mc small,.sub{color:var(--mu);font-size:13px}
.pill{font-size:11px;font-weight:800;background:var(--go);color:#1b1b1b;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.pct{margin-left:auto;font-weight:800;color:var(--ok)}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--rd);color:#fff}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--go);transition:width .2s}
.opt{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu);margin:6px 0 10px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px;display:flex;align-items:center;color:var(--rd)}
h2 button{margin-left:auto;border:1px solid var(--rd);background:none;color:var(--rd);border-radius:8px;font-size:12px;padding:4px 8px;font-weight:700}
h2 span{color:var(--mu);margin-left:8px;font-weight:600}
.row{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:7px;display:flex;align-items:center;gap:12px;min-height:58px}
.row .bx{width:30px;height:30px;border-radius:9px;border:2px solid var(--ln);display:grid;place-items:center;color:transparent;font-weight:900;flex:none}
.row.on{border-color:var(--ok)}.row.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.row.on b{text-decoration:line-through;opacity:.65}
.row b{display:inline-block}.row b::first-letter{text-transform:uppercase}.row small{display:block;color:var(--mu);font-size:12px}
.row time{margin-left:auto;font-size:12px;color:var(--ok);font-weight:700}
.tag{font-size:10px;font-weight:800;border:1px solid var(--mu);color:var(--mu);border-radius:6px;padding:0 5px;margin-left:6px;text-transform:uppercase}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.side{background:var(--rd);color:#fff;border-radius:10px;padding:8px 12px;margin:22px 0 0;font-size:16px;display:flex;border-left:8px solid var(--go)}.side span{margin-left:auto;font-weight:600}
.dl{width:100%;background:var(--go);color:#1b1b1b;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;margin:8px 0}
.wb{margin-left:auto;flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-size:18px;color:var(--mu)}
.row.bad{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 8%,var(--card))}.row.bad .wb{background:var(--rd);color:#fff;border-color:var(--rd)}
.row small.pb{color:var(--rd);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 2px}.dlg h3::first-letter{text-transform:uppercase}.dlg textarea{width:100%;margin:10px 0;border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx)}
.ths{display:flex;gap:8px;flex-wrap:wrap}.th{position:relative}.th img{width:92px;height:92px;object-fit:cover;border-radius:10px}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--rd);color:#fff;font-weight:900}
.btn2{display:block;text-align:center;border:2px dashed var(--rd);color:var(--rd);border-radius:12px;padding:12px;font-weight:700;margin:12px 0}
.act{display:flex;gap:8px}.act button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;background:var(--ln);color:var(--tx)}.act button[data-ok]{background:var(--rd);color:#fff}
.er{color:var(--rd);font-weight:600;margin:4px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1b1b1b;color:#fff;border-radius:12px;padding:12px;z-index:30;display:none;text-align:center}
footer{color:var(--mu);font-size:12px;text-align:center;padding:10px 12px 30px}
</style></head><body>

$("#app").innerHTML='<div class="sub" style="margin:2px 2px 10px">62 contrôles (58 espaces + vitres et garde-corps) · 17 matchs à domicile. Choisis un match pour lancer les contrôles.</div>'+M.map((m,i)=>{const[d,t]=stats(i),p=t?Math.round(100*d/t):0;
return`<div class="card mc ${i==nx?"next":""} ${m[0]<today&&i!=nx?"past":""}" data-m="${i}"><div class="j">J${m[2]}</div><div><b>RAF – ${m[1]}${i==nx?'<span class="pill">PROCHAIN</span>':""}</b><small>${fd(m[0])} · veille ${eve(m[0])}</small></div><div class="pct">${p}%</div></div>`}).join("")}
function match(){const i=V.mi,m=M[i];
$("#back").style.display="block";$("#ttl").textContent="RAF – "+m[1];$("#sub").textContent="J"+m[2]+" · "+fd(m[0])+" · veille "+eve(m[0]);
const L=list(i,V.ph,V.tr,V.all),[d,t]=stats(i,V.ph,V.tr,V.all),np=L.filter(it=>P[key(i,it,V.ph)]).length;
const sg=(a,k,o)=>`<div class="seg">${o.map(([v,l])=>`<button data-${a}="${v}" class="${V[k]==v?"on":""}">${l}</button>`).join("")}</div>`;
let h=sg("ph","ph",[["V","Veille (J-1)"],["A","Après match"]])+sg("tr","tr",[["T","Ouest + Est"],["O","Ouest (Haras)"],["E","Est (Cathédrale)"]]);
h+=`<div class="bar"><i style="width:${t?100*d/t:0}%"></i></div><div class="sub"><b>${d}/${t}</b> espaces contrôlés${np?` · <b style="color:var(--rd)">⚠ ${np} problème${np>1?"s":""}</b>`:""}</div>`;
h+=`<button class="dl" data-dl="1">⬇ Télécharger le rapport PDF</button>`;
h+=`<label class="opt"><input type="checkbox" id="all" ${V.all?"checked":""}> Afficher aussi les espaces mensuels / trimestriels non dus</label>`;
if(!L.length)h+='<div class="empty">Aucun espace à contrôler.</div>';
for(const tr of V.tr=="T"?["O","E"]:[V.tr]){const G=L.filter(it=>it.t==tr);if(!G.length)continue;
h+=`<h3 class="side">Tribune ${TN[tr]}<span>${G.filter(it=>S[key(i,it,V.ph)]).length}/${G.length}</span></h3>`;
for(const c in CAT){const g=G.filter(it=>it.c==c);if(!g.length)continue;const gd=g.filter(it=>S[key(i,it,V.ph)]).length;
h+=`<h2>${CAT[c]}<span>${gd}/${g.length}</span><button data-sec="${tr}|${c}">${gd==g.length?"Décocher":"Tout cocher"}</button></h2>`;
h+=g.map(it=>{const k=key(i,it,V.ph),v=S[k],p=P[k];return`<div class="row ${v?"on":""} ${p?"bad":""}" data-k="${k}"><span class="bx">✓</span><div><b>${it.n}</b>${it.r!="M"?`<span class="tag">${REC[it.r]}</span>`:""}<small>${[v,it.m?nm(it.m)+" m²":""].filter(Boolean).join(" · ")||"–"}</small>${p?`<small class="pb">⚠ ${esc(p.c).slice(0,50)}${p.ph.length?" · 📷"+p.ph.length:""}</small>`:""}</div><button class="wb" data-p="${k}" aria-label="Signaler un problème">⚠</button></div>`}).join("")}}
const y=scrollY;$("#app").innerHTML=h;scrollTo(0,y)}
let D=null;
function flash(s){const e=$("#toast");e.textContent=s;e.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>e.style.display="none",3500)}
function openP(k){const p=P[k];D={k,c:p?p.c:"",ph:p?p.ph.slice():[]};mod()}
function mod(msg){if(!D){$("#modal").innerHTML="";return}const[mi,id,ph]=D.k.split("|"),it=items.find(x=>x.t+x.i==id);
$("#modal").innerHTML=`<div class="ov"><div class="dlg"><h3>⚠ ${it.n}</h3><small class="sub">Tribune ${TN[it.t]} · ${ph=="V"?"Veille de match":"Après match"} · RAF – ${M[mi][1]}</small><textarea id="cm" rows="4" placeholder="Décris le problème…">${esc(D.c)}</textarea><div class="ths">${D.ph.map((p,j)=>`<div class="th"><img src="${p.u}" alt=""><button data-rm="${j}">×</button></div>`).join("")}</div><label class="btn2">📷 Ajouter une photo<input type="file" id="fi" accept="image/*" hidden></label>${msg?`<p class="er">${msg}</p>`:""}<div class="act"><button data-ok="1">Enregistrer</button><button data-no="1">Annuler</button>${P[D.k]?'<button data-del="1">Supprimer</button>':""}</div></div></div>`}
function pic(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);D.ph.push({u:c.toDataURL("image/jpeg",.6),w,h});mod()};im.src=r.result};r.readAsDataURL(f)}
$("#modal").addEventListener("input",e=>{if(e.target.id=="cm")D.c=e.target.value});
$("#modal").addEventListener("change",e=>{if(e.target.id=="fi"&&e.target.files[0])pic(e.target.files[0])});
$("#modal").addEventListener("click",e=>{const g=s=>e.target.closest(s);let x;
if(x=g("[data-rm]")){D.ph.splice(+x.dataset.rm,1);mod()}
else if(g("[data-no]")){D=null;mod()}
else if(g("[data-del]")){delete P[D.k];saveP();D=null;mod();render()}
else if(g("[data-ok]")){if(!D.c.trim()&&!D.ph.length){mod("Ajoute un commentaire ou une photo.");return}
P[D.k]={c:D.c.trim(),ph:D.ph,t:hm()};if(!saveP()){mod("Mémoire du téléphone pleine : retire une photo.");return}D=null;mod();render()}});
const clean=s=>(s||"").replace(/[^\u0020-\u00ff\u2013\u2019\u2018\u201c\u201d\u2026\n]/g,"");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function report(i){const m=M[i],doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=210;let y=36;
doc.setFillColor(200,16,46);doc.rect(0,0,W,26,"F");doc.setFillColor(255,199,44);doc.rect(0,26,W,2,"F");
try{doc.addImage($(".logo").src,"PNG",8,3,16,20)}catch(e){}
doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Rapport de ménage – RAF – "+clean(m[1]),30,12);
doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text("Stade Paul-Lignon · J"+m[2]+" · "+fd(m[0],{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · édité le "+new Date().toLocaleString("fr-FR"),30,19);
const need=n=>{if(y+n>284){doc.addPage();y=16}};
const E=[];for(const ph of["V","A"])for(const it of items)if(ph=="V"||it.l=="12"){const k=key(i,it,ph);if(due(it,i)||S[k]||P[k])E.push({ph,it,k,st:P[k]?"b":S[k]?"o":"n"})}
const cn=s=>E.filter(e=>e.st==s).length;
doc.setTextColor(30,30,30);doc.setFont("helvetica","bold");doc.setFontSize(11);
doc.text("Bilan : "+cn("o")+" OK · "+cn("b")+" problème(s) · "+cn("n")+" non contrôlé(s)",14,y);y+=4;
for(const ph of["V","A"]){need(16);y+=6;doc.setFillColor(200,16,46);doc.rect(14,y-5,W-28,8,"F");doc.setTextColor(255,255,255);doc.setFontSize(11);
doc.text(ph=="V"?"Veille de match – "+eve(m[0]):"Après match – "+fd(m[0]),17,y+0.8);y+=9;
for(const tr of["O","E"]){const T=E.filter(e=>e.ph==ph&&e.it.t==tr);if(!T.length)continue;need(14);doc.setTextColor(200,16,46);doc.setFontSize(12);doc.text("Tribune "+TN[tr],14,y);y+=6;
for(const c in CAT){const g=T.filter(e=>e.it.c==c);if(!g.length)continue;need(12);doc.setTextColor(110,110,110);doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text(CAT[c].toUpperCase(),16,y);y+=5;
for(const e of g){need(7);const p=P[e.k];doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(30,30,30);doc.text(cap(e.it.n)+(e.it.m?" ("+nm(e.it.m)+" m²)":""),18,y);
doc.setFont("helvetica","bold");const col=e.st=="b"?[200,16,46]:e.st=="o"?[31,138,76]:[130,130,130];doc.setTextColor(...col);
doc.text((e.st=="b"?"PROBLÈME":e.st=="o"?"OK":"NON CONTRÔLÉ")+(S[e.k]?"  "+S[e.k]:""),W-14,y,{align:"right"});y+=5.5;
if(p){doc.setFont("helvetica","normal");doc.setTextColor(150,20,40);const ls=doc.splitTextToSize(clean(p.c)||"(photo sans commentaire)",W-44);need(ls.length*4.5+2);doc.text(ls,24,y);y+=ls.length*4.5+1.5;
for(let j=0;j<p.ph.length;j+=2){const pr=p.ph.slice(j,j+2).map(q=>{const w=Math.min(60,70*q.w/q.h);return{q,w,h:w*q.h/q.w}}),hh=Math.max(...pr.map(z=>z.h));need(hh+3);let x=24;for(const z of pr){try{doc.addImage(z.q.u,"JPEG",x,y,z.w,z.h)}catch(er){}x+=z.w+5}y+=hh+3}}}
y+=2}}}
return doc}
async function dl(){const i=V.mi,m=M[i];let d=null;try{d=window.claude&&await window.claude.use("downloads")}catch(e){}
if(!window.jspdf){flash("Générateur PDF indisponible (connexion nécessaire).");return}
const fn="rapport-menage-RAF-"+m[1].normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\W+/g,"-")+"-"+m[0]+".pdf";
if(!d){try{report(i).save(fn)}catch(e){flash("Échec de la génération du PDF.")}return}
try{const doc=report(i);await d.save({filename:fn,data:doc.output("blob")})}catch(e){if(!e||e.code!="declined")flash("Échec du téléchargement ("+((e&&e.code)||"erreur")+")")}}
const render=()=>V.mi===null?home():match();
const hm=()=>new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
$("#app").addEventListener("click",e=>{const g=s=>e.target.closest(s);let x;
if(x=g("[data-m]")){V={mi:+x.dataset.m,ph:"V",tr:"T",all:false};scrollTo(0,0)}
else if(x=g("[data-p]")){openP(x.dataset.p);return}
else if(g("[data-dl]")){dl();return}
else if(x=g("[data-k]")){const k=x.dataset.k;S[k]?delete S[k]:S[k]=hm();save()}
else if(x=g("[data-sec]")){const[tr,c]=x.dataset.sec.split("|"),ks=list(V.mi,V.ph,V.tr,V.all).filter(it=>it.t==tr&&it.c==c).map(it=>key(V.mi,it,V.ph)),all=ks.every(k=>S[k]);ks.forEach(k=>all?delete S[k]:S[k]=S[k]||hm());save()}
else if(x=g("[data-ph]"))V.ph=x.dataset.ph;
else if(x=g("[data-tr]"))V.tr=x.dataset.tr;
else if(g("#all"))V.all=!V.all;else return;render()});
$("#back").onclick=()=>{V.mi=null;render();scrollTo(0,0)};
render();
</script></body></html>
